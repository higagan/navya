[project]
name = "navya-ocr-pipeline"
version = "0.1.0"
description = "OCR + citation-structuring pipeline for scanned Sanskrit philosophy texts"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
